<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2 - JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .section {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
    }

    h2 {
      color: #555;
      margin-top: 0;
    }

    button {
      padding: 8px 16px;
      margin-top: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    input {
      padding: 6px;
      font-size: 14px;
      width: 80px;
    }

    p {
      font-size: 15px;
    }

    #result {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Task 2 - JavaScript</h1>

  <!-- Part 1: Color changing button -->
  <div class="section">
    <h2>1. Button that changes color when clicked</h2>
    <button id="colorBtn" onclick="changeColor()">Click Me</button>
    <p id="colorText">Button color: orange</p>
  </div>

  <!-- Part 2: Greeting based on time -->
  <div class="section">
    <h2>2. Greeting based on current time</h2>
    <button onclick="showGreeting()">Show Greeting</button>
    <p id="greeting"></p>
  </div>

  <!-- Part 3: Basic calculator -->
  <div class="section">
    <h2>3. Basic Calculator (Addition)</h2>
    <input type="number" id="num1" placeholder="Number 1">
    +
    <input type="number" id="num2" placeholder="Number 2">
    <br>
    <button onclick="addNumbers()">Add</button>
    <p id="result"></p>
  </div>

  <script>
    // Part 1 - Change button color on click
    var colors = ["orange", "blue", "green", "red", "purple"];
    var currentColor = 0;

    function changeColor() {
      currentColor = currentColor + 1;
      if (currentColor >= colors.length) {
        currentColor = 0;
      }
      document.getElementById("colorBtn").style.backgroundColor = colors[currentColor];
      document.getElementById("colorText").innerText = "Button color: " + colors[currentColor];
    }

    // Part 2 - Show greeting based on time
    function showGreeting() {
      var hour = new Date().getHours();
      var message = "";

      if (hour < 12) {
        message = "Good Morning!";
      } else if (hour < 17) {
        message = "Good Afternoon!";
      } else if (hour < 21) {
        message = "Good Evening!";
      } else {
        message = "Good Night!";
      }

      document.getElementById("greeting").innerText = message;
    }

    // Part 3 - Add two numbers
    function addNumbers() {
      var num1 = parseFloat(document.getElementById("num1").value);
      var num2 = parseFloat(document.getElementById("num2").value);
      var sum = num1 + num2;
      document.getElementById("result").innerText = "Answer: " + sum;
    }
  </script>

</body>
</html>
